<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raya — Justin Priem</title>
<meta name="description" content="Ein Fotobuch von Raya, sortierbar nach Datum.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="shortcut icon" href="assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/raya.css">
</head>
<body>

<div class="paw-field" aria-hidden="true">
  <span class="paw pw-1">🐾</span>
  <span class="paw pw-2">🐾</span>
  <span class="paw pw-3">🐾</span>
  <span class="paw pw-4">🐾</span>
  <span class="paw pw-5">🐾</span>
  <span class="paw pw-6">🐾</span>
</div>

<a class="back-link" href="index.html">← justin-priem.de</a>

<header class="ry-hero">
  <p class="ry-eyebrow"><span class="paw-inline" aria-hidden="true">🐾</span>Sehr gute Hündin</p>
  <h1>Raya<span class="ry-wag" aria-hidden="true">🐾</span></h1>
  <p class="ry-lede">Ein kleines Fotobuch — <span id="total-photos">0</span> Fotos und wachsend.</p>
</header>

<main class="ry-main">
  <div class="ry-controls">
    <div class="ry-cols" role="group" aria-label="Spalten pro Reihe" id="raya-cols">
      <span class="ry-cols-label">Spalten</span>
      <button type="button" class="ry-col-btn" data-cols="1" aria-label="1 Bild pro Reihe">1</button>
      <button type="button" class="ry-col-btn" data-cols="2" aria-label="2 Bilder pro Reihe">2</button>
      <button type="button" class="ry-col-btn" data-cols="3" aria-label="3 Bilder pro Reihe">3</button>
    </div>
    <label class="ry-sort-label" for="raya-sort">Sortieren</label>
    <select id="raya-sort">
      <option value="newest">Neueste zuerst</option>
      <option value="oldest">Älteste zuerst</option>
    </select>
  </div>

  <section class="photo-grid" id="raya-grid" aria-live="polite"></section>
</main>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightbox-close" aria-label="Schließen">✕</button>
  <figure class="lightbox-figure">
    <img id="lightbox-img" src="" alt="">
    <figcaption id="lightbox-caption"></figcaption>
  </figure>
</div>

<footer id="site-footer"></footer>

<script src="js/socials.js"></script>
<script src="js/raya-data.js"></script>
<script src="js/raya.js"></script>
</body>
</html>
